<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Make My Lesson — Logo Animation</title>
<style>
  :root {
    --navy: #202241;
    --teal: #4fb0a5;
    --gold: #e8be51;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--navy);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--navy);
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 34px;
  }

  /* ---- Icon area: ring pulse plays first, then icon fades in ---- */
  .icon-box {
    position: relative;
    width: 190px; height: 216px;
    display: flex; align-items: center; justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid var(--teal);
    opacity: 0;
  }
  .ring-1 {
    width: 90px; height: 90px;
    animation: ringExpand 1.8s cubic-bezier(.16,1,.3,1) 0.4s forwards;
  }
  .ring-2 {
    width: 90px; height: 90px;
    border-color: var(--gold);
    animation: ringExpand 1.8s cubic-bezier(.16,1,.3,1) 0.75s forwards;
  }
  @keyframes ringExpand {
    0%   { opacity: 0.8; transform: scale(0.6); }
    100% { opacity: 0; transform: scale(2.6); }
  }

  .icon-img {
    width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.88);
    animation: iconIn 1.2s cubic-bezier(.22,1,.36,1) 1.25s forwards;
  }
  @keyframes iconIn {
    0%   { opacity: 0; transform: scale(0.88); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ---- Text ---- */
  .text-img {
    height: 190px;
    object-fit: contain;
    opacity: 0;
    transform: translateX(-20px);
    animation: textIn 1.2s cubic-bezier(.22,1,.36,1) 2.15s forwards;
  }
  @keyframes textIn {
    0%   { opacity: 0; transform: translateX(-20px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  .replay-btn {
    position: absolute;
    bottom: 24px; right: 24px;
    background: rgba(255,255,255,0.06);
    color: #f1f1f1;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 9px 18px;
    border-radius: 22px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.25s, transform 0.25s;
    z-index: 5;
  }
  .replay-btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
</style>
</head>
